[package]
name = "carapana-cli"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Read-only local CLI for the Carapanã daemon"

[lints]
workspace = true

[[bin]]
name = "carapana"
path = "src/main.rs"

[dependencies]
carapana-daemon = { path = "../carapana-daemon" }
carapana-protocol = { path = "../carapana-protocol" }
carapana-storage = { path = "../carapana-storage" }
clap = { version = "=4.6.7", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
ratatui = "=0.30.2"
crossterm = "=0.29.0"
signal-hook = "=0.3.18"

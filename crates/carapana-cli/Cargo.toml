[package]
name = "carapana-cli"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Local CLI for persisted Carapanã sessions and gated recovery"

[lints]
workspace = true

[[bin]]
name = "carapana"
path = "src/main.rs"

[dependencies]
carapana-daemon = { path = "../carapana-daemon" }
carapana-core = { path = "../carapana-core" }
carapana-openai = { path = "../carapana-openai" }
carapana-protocol = { path = "../carapana-protocol" }
carapana-storage = { path = "../carapana-storage" }
carapana-sandbox = { path = "../carapana-sandbox" }
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = "=0.3.34"
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
ratatui = "=0.30.2"
crossterm = "=0.29.0"
signal-hook = "=0.3.18"

[target.'cfg(unix)'.dev-dependencies]
carapana-sandbox = { path = "../carapana-sandbox" }
nix = { version = "=0.29.0", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
sha2 = "=0.10.9"

[package]
name = "carapana-daemon"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Fail-safe local daemon bootstrap for Carapanã sessions"

[lints]
workspace = true

[dependencies]
carapana-protocol = { path = "../carapana-protocol" }
carapana-storage = { path = "../carapana-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package]
name = "carapana-storage"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "SQLite schema and migration foundation for local Carapanã sessions"

[lints]
workspace = true

[dependencies]
carapana-protocol = { path = "../carapana-protocol" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

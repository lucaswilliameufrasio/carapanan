[package]
name = "carapana-ui-prototype"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Delivery 0 CLI/TUI prototype using fixtures only; no agent runtime"

[[bin]]
name = "carapana-prototype"
path = "src/main.rs"

[dependencies]
ratatui = "=0.30.2"
crossterm = "=0.29.0"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
